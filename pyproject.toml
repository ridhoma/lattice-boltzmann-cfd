[tool.poetry]
name = "lattice-boltzmann-cfd"
version = "0.1.0"
description = "Solving and simulating fluid dynamics computationally via statistical physics using Lattice-Boltzmann (LBM) method"
readme = "README.md"
authors = [
    "R.Akbar <ridhomakbar@gmail.com>"
]
license = "MIT"
packages = [{ include = "lbm", from = "src" }]
[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = ">=2.3.2,<3.0.0"
scipy = ">=1.16.1,<2.0.0"
matplotlib = ">=3.10.5,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
torch = "^2.8.0"
tqdm = "^4.67.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.5.0"
black = "^24.0"
jupyter = ">=1.1.1,<2.0.0"
jupyterlab = "^4.4.5"
ipykernel = "^6.29"
ipywidgets = "^8.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
